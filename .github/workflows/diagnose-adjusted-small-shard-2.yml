name: Diagnose Adjusted Small Shard 2

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/diagnose-adjusted-small-shard-2.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download prepared data and small model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts .models/kronos-small
          gh api repos/${{ github.repository }}/actions/artifacts/8831599258/zip > /tmp/data.zip
          unzip -q /tmp/data.zip -d .artifacts
          gh api repos/${{ github.repository }}/actions/artifacts/8831599156/zip > /tmp/small.zip
          unzip -q /tmp/small.zip -d .models/kronos-small
      - name: Reproduce exact cohort batches and capture invalid closes
        run: |
          python - <<'PY'
          import json
          import random
          from pathlib import Path

          import numpy as np
          import pandas as pd
          import torch

          from bist_data.universe import load_universe
          from bist_eval.benchmark import _prepare
          from bist_eval.calendar import build_canonical_calendar, build_monthly_cohorts
          from bist_eval.data import discover_raw_symbol_files, load_raw_symbol_frame, load_timestamp_coverage
          from bist_eval.model_adapter import KronosModelAdapter, MODEL_COLUMNS, derive_cohort_seed

          universe = Path("data/universes/xu100_2026_q3.csv")
          ordered = [entry.symbol for entry in load_universe(universe)]
          selected = ordered[20:30]
          assert selected == ["ENKAI", "EREGL", "FENER", "FROTO", "GARAN", "GSRAY", "GUBRF", "TURSG", "HALKB", "HEKTS"]

          files = discover_raw_symbol_files(Path(".artifacts/source/raw"), ordered)
          coverage = load_timestamp_coverage(files)
          calendar = build_canonical_calendar(
              coverage,
              coverage_threshold=0.8,
              start_date="2023-01-01",
              end_date="2026-08-02",
          )
          cohorts, _ = build_monthly_cohorts(calendar, horizon=5)
          raw_frames = {symbol: load_raw_symbol_frame(files[symbol]) for symbol in selected}
          groups, _ = _prepare(raw_frames, cohorts, selected, 400, 5, 1e-8)

          manifest = json.load(open(".models/kronos-small/asset_manifest.json"))
          adapter = KronosModelAdapter(
              model_id="NeoQuasar/Kronos-small",
              tokenizer_id="NeoQuasar/Kronos-Tokenizer-base",
              model_path=Path(".models/kronos-small/model"),
              tokenizer_path=Path(".models/kronos-small/tokenizer"),
              model_revision=manifest["model_revision"],
              tokenizer_revision=manifest["tokenizer_revision"],
              device="cpu",
              temperature=1.0,
              top_p=0.9,
              sample_count=1,
              seed=20260802,
          ).load()

          failures = []
          for (origin, target_timestamps), items in sorted(groups.items(), key=lambda pair: pair[0][0]):
              windows = [bundle.prediction_window(rebased) for bundle, raw, rebased, origin_factor, exposure, repairs in items]
              seed = derive_cohort_seed(20260802, origin)
              random.seed(seed)
              np.random.seed(seed)
              torch.manual_seed(seed)
              outputs = adapter.predictor.predict_batch(
                  [window.context.loc[:, MODEL_COLUMNS] for window in windows],
                  [window.context.timestamps for window in windows],
                  [pd.Series(window.target_timestamps) for window in windows],
                  pred_len=5,
                  T=1.0,
                  top_p=0.9,
                  sample_count=1,
                  verbose=False,
              )
              cohort_failures = []
              for window, output in zip(windows, outputs):
                  closes = pd.to_numeric(output["close"], errors="coerce").to_numpy(float)
                  valid = bool(np.isfinite(closes).all() and (closes > 0).all())
                  if not valid:
                      item = {
                          "symbol": window.symbol,
                          "origin": pd.Timestamp(origin).isoformat(),
                          "target_timestamps": [pd.Timestamp(value).isoformat() for value in target_timestamps],
                          "context_close_min": float(window.context.close.min()),
                          "context_close_max": float(window.context.close.max()),
                          "predicted_close": closes.tolist(),
                          "finite": bool(np.isfinite(closes).all()),
                          "positive": bool((closes > 0).all()),
                      }
                      cohort_failures.append(item)
                      print("INVALID", json.dumps(item, sort_keys=True))
              if cohort_failures:
                  failures.extend(cohort_failures)
                  break
              print("VALID_COHORT", pd.Timestamp(origin).date().isoformat(), len(windows))

          Path("diagnostic.json").write_text(json.dumps(failures, indent=2), encoding="utf-8")
          assert failures, "exact shard batching did not reproduce invalid close"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-small-shard-2-diagnostic-${{ github.run_id }}
          path: diagnostic.json
          retention-days: 14
          if-no-files-found: error
