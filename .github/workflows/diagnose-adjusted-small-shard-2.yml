name: Diagnose Adjusted Small Shard 2

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/diagnose-adjusted-small-shard-2.yml"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download prepared data and small model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .artifacts .models/kronos-small
          gh api repos/${{ github.repository }}/actions/artifacts/8831599258/zip > /tmp/data.zip
          unzip -q /tmp/data.zip -d .artifacts
          gh api repos/${{ github.repository }}/actions/artifacts/8831599156/zip > /tmp/small.zip
          unzip -q /tmp/small.zip -d .models/kronos-small
      - name: Print first-cohort raw small-model outputs
        run: |
          python - <<'PY'
          import json
          import random
          import numpy as np
          import pandas as pd
          import torch
          from pathlib import Path

          from bist_data.universe import load_universe
          from bist_eval.adjustments import rebase_context
          from bist_eval.calendar import build_canonical_calendar, build_monthly_cohorts
          from bist_eval.data import discover_raw_symbol_files, load_raw_symbol_frame, load_timestamp_coverage
          from bist_eval.model_adapter import KronosModelAdapter, MODEL_COLUMNS, derive_cohort_seed
          from bist_eval.windows import build_benchmark_windows

          universe = Path("data/universes/xu100_2026_q3.csv")
          ordered = [entry.symbol for entry in load_universe(universe)]
          files = discover_raw_symbol_files(Path(".artifacts/source/raw"), ordered)
          coverage = load_timestamp_coverage(files)
          calendar = build_canonical_calendar(
              coverage,
              coverage_threshold=0.8,
              start_date="2023-01-01",
              end_date="2023-01-31",
          )
          cohorts, skips = build_monthly_cohorts(calendar, horizon=5)
          assert cohorts, skips

          manifest = json.load(open(".models/kronos-small/asset_manifest.json"))
          adapter = KronosModelAdapter(
              model_id="NeoQuasar/Kronos-small",
              tokenizer_id="NeoQuasar/Kronos-Tokenizer-base",
              model_path=Path(".models/kronos-small/model"),
              tokenizer_path=Path(".models/kronos-small/tokenizer"),
              model_revision=manifest["model_revision"],
              tokenizer_revision=manifest["tokenizer_revision"],
              device="cpu",
              temperature=1.0,
              top_p=0.9,
              sample_count=1,
              seed=20260802,
          ).load()

          symbols = ["ENKAI", "EREGL", "FENER", "FROTO", "GARAN", "GSRAY", "GUBRF", "TURSG", "HALKB", "HEKTS"]
          failures = []
          for symbol in symbols:
              frame = load_raw_symbol_frame(files[symbol])
              bundles, symbol_skips = build_benchmark_windows(
                  symbol, frame, cohorts, lookback=400, horizon=5
              )
              if not bundles:
                  print(f"DIAG {symbol} NO_ELIGIBLE {symbol_skips}")
                  continue
              bundle = bundles[0]
              origin_factor = float(bundle.context_provider_factors[-1])
              rebased, _ = rebase_context(
                  bundle.raw_context,
                  bundle.context_provider_factors,
                  origin_factor,
              )
              window = bundle.prediction_window(rebased)
              seed = derive_cohort_seed(20260802, window.forecast_origin)
              random.seed(seed)
              np.random.seed(seed)
              torch.manual_seed(seed)
              output = adapter.predictor.predict_batch(
                  [window.context.loc[:, MODEL_COLUMNS]],
                  [window.context.timestamps],
                  [pd.Series(window.target_timestamps)],
                  pred_len=5,
                  T=1.0,
                  top_p=0.9,
                  sample_count=1,
                  verbose=False,
              )[0]
              closes = pd.to_numeric(output["close"], errors="coerce").to_numpy(float)
              valid = bool(np.isfinite(closes).all() and (closes > 0).all())
              print(
                  "DIAG",
                  symbol,
                  window.forecast_origin.isoformat(),
                  "context_close_min=", float(window.context.close.min()),
                  "context_close_max=", float(window.context.close.max()),
                  "predicted_close=", closes.tolist(),
                  "valid=", valid,
              )
              if not valid:
                  failures.append({
                      "symbol": symbol,
                      "origin": window.forecast_origin.isoformat(),
                      "predicted_close": closes.tolist(),
                  })
          Path("diagnostic.json").write_text(json.dumps(failures, indent=2))
          assert failures, "diagnostic did not reproduce invalid close"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-small-shard-2-diagnostic-${{ github.run_id }}
          path: diagnostic.json
          retention-days: 14
          if-no-files-found: error
