name: BIST Yahoo End-Exclusive Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/bist-yahoo-end-exclusive-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas==2.2.2 yfinance==1.5.1
      - name: Inspect raw Yahoo response
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf

          frame = yf.download(
              "THYAO.IS",
              start="2015-01-01",
              end="2026-08-02",
              interval="1d",
              auto_adjust=False,
              actions=False,
              progress=False,
              group_by="column",
              threads=False,
          )
          print("shape", frame.shape)
          print("columns", list(frame.columns))
          required = ["Open", "High", "Low", "Close", "Volume"]
          selected = frame.loc[:, required]
          missing = selected.isna().any(axis=1)
          print("missing_count", int(missing.sum()))
          print(frame.loc[missing].to_string())
          assert missing.any(), "expected to reproduce missing OHLCV row"
          PY
