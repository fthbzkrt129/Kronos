name: Apply Adjusted Benchmark Implementation

on:
  pull_request:
    branches: [master]
    paths:
      - ".implementation-payload/**"
      - "scripts/_apply_adjusted_benchmark_payload.py"
      - ".github/workflows/apply-adjusted-benchmark-implementation.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Apply payload
        run: python scripts/_apply_adjusted_benchmark_payload.py
      - name: Install network-free test dependencies
        run: python -m pip install numpy pandas pytest
      - name: Verify implementation
        run: |
          python -m pytest tests/bist_eval -v
          python -m compileall -q bist_eval \
            scripts/validate_bist_adjustment_factors.py \
            scripts/evaluate_bist100_adjusted_benchmark.py \
            scripts/reduce_bist100_adjusted_benchmark.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(eval): implement adjusted Kronos benchmark"
          git push origin HEAD:${{ github.head_ref }}
