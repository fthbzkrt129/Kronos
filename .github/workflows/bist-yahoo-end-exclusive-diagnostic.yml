name: BIST Yahoo End-Exclusive Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/bist-yahoo-end-exclusive-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas==2.2.2 yfinance==1.5.1
      - name: Verify completed-date boundary
        run: |
          python scripts/download_bist_yahoo.py \
            --universe data/universes/xu100_2026_q3.csv \
            --as-of 2026-08-02 \
            --symbols THYAO \
            --start 2015-01-01 \
            --end 2026-08-02 \
            --output diagnostic/completed-end \
            --retries 1 \
            --sleep-seconds 0 \
            --fail-on-error
          python - <<'PY'
          import json
          manifest = json.load(open("diagnostic/completed-end/manifest.json"))
          assert manifest["summary"] == {"requested": 1, "succeeded": 1, "failed": 0}, manifest
          print(json.dumps(manifest["summary"], indent=2))
          print(manifest["successes"][0]["last_timestamp"])
          PY
