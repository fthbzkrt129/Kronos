name: BIST Yahoo Current-Date Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/bist-yahoo-current-date-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas==2.2.2 yfinance==1.5.1
      - name: Reproduce with one symbol
        run: |
          python scripts/download_bist_yahoo.py \
            --universe data/universes/xu100_2026_q3.csv \
            --as-of 2026-08-02 \
            --symbols THYAO \
            --start 2015-01-01 \
            --end 2026-08-03 \
            --output diagnostic/current-end \
            --retries 1 \
            --sleep-seconds 0
          python - <<'PY'
          import json
          manifest = json.load(open("diagnostic/current-end/manifest.json"))
          print(json.dumps(manifest["failures"], indent=2, ensure_ascii=False))
          assert manifest["summary"]["failed"] == 1
          PY
