name: BIST Evaluation Tests

on:
  pull_request:
    branches: [master]
    paths:
      - "bist_eval/**"
      - "scripts/evaluate_bist100_zero_shot.py"
      - "scripts/reduce_bist100_zero_shot.py"
      - "scripts/resolve_kronos_assets.py"
      - "scripts/validate_bist_adjustment_factors.py"
      - "scripts/evaluate_bist100_adjusted_benchmark.py"
      - "scripts/reduce_bist100_adjusted_benchmark.py"
      - "tests/bist_eval/**"
      - ".github/workflows/bist-eval-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install network-free dependencies
        run: python -m pip install numpy pandas pytest
      - name: Run evaluation tests
        run: python -m pytest tests/bist_eval -v
      - name: Compile evaluation modules
        run: >-
          python -m compileall -q bist_eval
          scripts/evaluate_bist100_zero_shot.py
          scripts/reduce_bist100_zero_shot.py
          scripts/resolve_kronos_assets.py
          scripts/validate_bist_adjustment_factors.py
          scripts/evaluate_bist100_adjusted_benchmark.py
          scripts/reduce_bist100_adjusted_benchmark.py
