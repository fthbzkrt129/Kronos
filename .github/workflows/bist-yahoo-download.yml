name: BIST Yahoo Data Download

on:
  push:
    branches:
      - feature/bist-yahoo-data-pipeline
    paths:
      - ".github/workflows/bist-yahoo-download.yml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/bist-yahoo-download.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install BIST pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas==2.2.2 yfinance pytest

      - name: Run BIST pipeline tests
        run: python -m pytest tests/bist_data -v

      - name: Download BIST 100 daily candles
        id: download
        continue-on-error: true
        run: |
          python scripts/download_bist_yahoo.py \
            --universe data/universes/xu100_2026_q3.csv \
            --as-of 2026-08-02 \
            --start 2015-01-01 \
            --end 2026-08-03 \
            --output data/bist/yahoo \
            --retries 3 \
            --sleep-seconds 1.5 \
            --fail-on-error

      - name: Print download manifest summary
        if: always()
        run: |
          if [ -f data/bist/yahoo/manifest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("data/bist/yahoo/manifest.json").read_text())
          print(json.dumps(manifest["summary"], indent=2))
          if manifest["failures"]:
              print("Failed symbols:")
              for failure in manifest["failures"]:
                  print(f"- {failure['symbol']}: {failure['error_type']}: {failure['error']}")
          PY
          else
            echo "Manifest was not generated."
            exit 1
          fi

      - name: Diagnose rejected OHLC rows
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from bist_data.yahoo import download_daily_candles

          manifest_path = Path("data/bist/yahoo/manifest.json")
          if not manifest_path.exists():
              print("No manifest available for diagnostics.")
              raise SystemExit(0)

          manifest = json.loads(manifest_path.read_text())
          output_dir = Path("data/bist/yahoo/diagnostics")
          output_dir.mkdir(parents=True, exist_ok=True)

          for failure in manifest["failures"]:
              symbol = failure["symbol"]
              try:
                  frame = download_daily_candles(
                      symbol,
                      start=manifest["request"]["start"],
                      end=manifest["request"]["end_exclusive"],
                      retries=3,
                      sleep_seconds=1.5,
                  )
                  required_high = frame[["open", "close", "low"]].max(axis=1)
                  required_low = frame[["open", "close", "high"]].min(axis=1)
                  bad_high = frame["high"] < required_high
                  bad_low = frame["low"] > required_low
                  rejected = frame.loc[bad_high | bad_low].copy()
                  rejected["required_high"] = required_high.loc[rejected.index]
                  rejected["high_shortfall"] = (
                      required_high.loc[rejected.index] - rejected["high"]
                  )
                  rejected["required_low"] = required_low.loc[rejected.index]
                  rejected["low_excess"] = (
                      rejected["low"] - required_low.loc[rejected.index]
                  )
                  rejected.to_csv(output_dir / f"{symbol}.csv", index=False)
                  print(f"Diagnostic rows for {symbol}:")
                  print(rejected.to_string(index=False))
              except Exception as exc:
                  print(f"Diagnostic download failed for {symbol}: {type(exc).__name__}: {exc}")
          PY

      - name: Upload BIST Yahoo data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bist-yahoo-2026-08-02
          path: data/bist/yahoo
          if-no-files-found: error
          retention-days: 7

      - name: Enforce complete download
        if: steps.download.outcome != 'success'
        run: exit 1
